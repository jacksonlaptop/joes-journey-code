<style>
  /* logo + menu stay hidden from first paint until the page drops them in (homepage-footer.js adds jj-nav-in) */
  html:not(.jj-nav-in) .nav-logo-link, html:not(.jj-nav-in) .menu-container { opacity: 0 !important; }

  html { background: #091725 !important; }
  body { background: transparent !important; }

  /* Hide the original sound panel — replaced by our own button */
  #jj-sound-panel { display: none !important; }

  #jj-bg-back-wrap {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    z-index: -2 !important;
    overflow: hidden !important;
    pointer-events: none !important;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  #jj-bg-front-wrap {
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: 100% !important;
    z-index: -1 !important;
    overflow: hidden !important;
    pointer-events: none !important;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  #jj-bg-back, #jj-bg-front {
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    height: 100% !important;
    width: auto !important;
    max-width: none !important;
    max-height: none !important;
    min-height: 100% !important;
    display: block !important;
    will-change: transform;
  }

  #jj-anim-stars-wrap {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    z-index: 2 !important;
    overflow: hidden !important;
    pointer-events: none !important;
    opacity: 0;
    transition: opacity 0.8s ease;
  }

  #jj-subtitle {
    bottom: 145px !important;
    font-size: clamp(24px, 3.2vw, 42px) !important;
    /* Wide captions wrap to two centred lines instead of spanning the screen */
    white-space: normal !important;
    max-width: min(76vw, 1100px) !important;
    width: auto !important;
    line-height: 1.25 !important;
  }

  html.jj-scroll-locked,
  html.jj-scroll-locked body {
    overflow: hidden !important;
    overscroll-behavior: none !important;
    touch-action: none !important;
    height: 100vh !important;
    max-height: 100vh !important;
  }

  .jj-cta-hidden { opacity: 0 !important; transition: none !important; pointer-events: none !important; }
  .jj-cta-revealing { opacity: 1 !important; transition: opacity 1.2s ease !important; pointer-events: auto !important; }
  .jj-wait-hidden { opacity: 0 !important; pointer-events: none !important; transition: none !important; }
  .jj-wait-revealing { opacity: 1 !important; transition: opacity 2s ease !important; }
  .jj-first-text-hidden { opacity: 0 !important; transition: none !important; }
  .jj-next-scene-hidden { opacity: 0 !important; transition: none !important; pointer-events: none !important; visibility: hidden !important; }
  .jj-next-scene-revealing { opacity: 1 !important; visibility: visible !important; transition: opacity 1.5s ease !important; pointer-events: auto !important; }

  .next-section-button {
    bottom: 110px !important;
    right: 32px !important;
  }
  .next-section-button.jj-next-scene-revealing {
    transition: opacity 1.5s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.35s ease !important;
  }
  .next-section-button:hover {
    transform: translateY(-3px) scale(1.04) !important;
    box-shadow: 0 12px 30px rgba(0,0,0,0.4), 0 0 24px rgba(199,231,255,0.3) !important;
  }

  .jj-panel-char {
    display: inline-block;
    will-change: transform, color, opacity;
    font-family: inherit;
    letter-spacing: inherit;
  }

  .jj-intro-deco { position: fixed; pointer-events: none; z-index: 3; transition: opacity 1s ease; }
  .jj-alien-sprite { z-index: 4; }
  .jj-poke-sprite { pointer-events: auto !important; cursor: none; }
  .jj-poke-sprite:hover { scale: 1.13; filter: drop-shadow(0 0 16px rgba(255,255,255,0.9)) drop-shadow(0 0 34px rgba(199,231,255,0.6)); }

  #jj-sitting-alien {
    position: fixed;
    bottom: 0;
    left: 12vw;
    width: 140px;
    height: auto;
    pointer-events: auto;
    cursor: none;
    z-index: 5;
    opacity: 1;
    transform: translateY(110%);
    transition: transform 1.1s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  #jj-sitting-alien.is-visible {
    opacity: 1;
    transform: translateY(15%);
  }
  #jj-sitting-alien.is-flying-out {
    opacity: 0;
    transform: translate(-12vw, -130vh) rotate(-22deg) scale(0.5);
    transition: transform 1.1s cubic-bezier(0.55, 0.05, 0.9, 0.3), opacity 0.6s ease 0.55s;
  }
  #jj-sitting-alien-lines {
    position: fixed;
    pointer-events: none;
    z-index: 6;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  #jj-sitting-alien-lines.is-visible { opacity: 1; }
  #jj-sitting-alien-lines .jj-emote-line {
    position: absolute;
    width: 3px;
    height: 14px;
    background: white;
    border-radius: 2px;
    transform-origin: bottom center;
  }
  @keyframes jj-emote-pop {
    0%   { opacity: 0; transform: translateY(8px) scaleY(0.4); }
    40%  { opacity: 1; transform: translateY(-4px) scaleY(1.05); }
    100% { opacity: 1; transform: translateY(0) scaleY(1); }
  }
  #jj-sitting-alien-lines.is-visible .jj-emote-line {
    animation: jj-emote-pop 0.45s ease-out forwards;
  }

  #jj-sitting-alien-speech {
    position: fixed;
    pointer-events: none;
    z-index: 6;
    opacity: 0;
    color: #ffffff;
    font-size: clamp(20px, 2.4vw, 34px);
    line-height: 1.3;
    text-align: left;
    white-space: nowrap;
    text-shadow: 0 2px 14px rgba(0,0,0,0.55);
    transform: translate(-50%, 8px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  #jj-sitting-alien-speech.is-visible {
    opacity: 1;
    transform: translate(-50%, 0);
  }
  #jj-sitting-alien-speech .jj-speech-char {
    display: inline-block;
    opacity: 0;
    transition: opacity 0.08s linear;
    white-space: pre;
    will-change: opacity, transform, color;
  }

  /* New sound button — moon, bottom-right under Next Scene */
  #jj-sound-btn {
    position: fixed;
    bottom: 32px;
    right: 32px;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #ffffff 0%, #e7f1fb 55%, #cfe0f2 100%);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    z-index: 9999;
    overflow: hidden;
    transform-origin: center center;
    will-change: transform, box-shadow;
    box-shadow: 0 0 18px rgba(199,231,255,0.5), 0 0 40px rgba(160,190,255,0.28);
    transition: background 0.25s ease;
  }
  #jj-sound-btn .jj-crater {
    position: absolute;
    border-radius: 50%;
    background: #93a9c6;
    pointer-events: none;
    z-index: 0;
  }
  #jj-sound-btn .jj-bar {
    width: 3px;
    background: #111;
    border-radius: 2px;
    height: 6px;
    position: relative;
    z-index: 2;
    transition: height 60ms linear, background 0.2s ease;
    will-change: height;
  }
  #jj-sound-btn.is-muted { background: #111; }
  #jj-sound-btn.is-muted .jj-bar { background: white; height: 3px !important; }
  #jj-sound-btn.is-muted .jj-crater { background: rgba(255,255,255,0.16); }
  #jj-sound-btn .jj-sound-fill {
    position: absolute;
    border-radius: 50%;
    background: #FF00F5;
    pointer-events: none;
    transform: scale(0);
    opacity: 0;
    z-index: 1;
  }

  #jj-sound-mist {
    position: fixed;
    bottom: -38px;
    right: -38px;
    width: 200px;
    height: 200px;
    pointer-events: none;
    z-index: 9998;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    filter: blur(24px);
    opacity: 0.55;
    border-radius: 50%;
  }
  #jj-sound-mist .jj-mist-bar {
    width: 10px;
    background: #ffffff;
    border-radius: 6px;
    height: 18px;
    will-change: height;
  }

  @keyframes jj-flash {
    0%, 100% { transform: scale(0.7); opacity: 0.3; }
    50%      { transform: scale(1.4); opacity: 1; }
  }
  @keyframes jj-twinkle {
    0%, 100% { transform: scale(1);    opacity: 0.5; }
    50%      { transform: scale(1.55); opacity: 1; }
  }
  @keyframes jj-glow {
    0%, 100% { filter: drop-shadow(0 0 8px rgba(255,255,255,0.7)) drop-shadow(0 0 24px rgba(255,255,255,0.4)); }
    50%      { filter: drop-shadow(0 0 45px rgba(255,255,255,1)) drop-shadow(0 0 90px rgba(255,255,255,0.75)) drop-shadow(0 0 160px rgba(180,200,255,0.5)); }
  }
  @keyframes jj-glow-subtle {
    0%, 100% { filter: drop-shadow(0 0 6px rgba(255,255,255,0.55)) drop-shadow(0 0 16px rgba(255,255,255,0.3)); }
    50%      { filter: drop-shadow(0 0 22px rgba(255,255,255,0.85)) drop-shadow(0 0 45px rgba(255,255,255,0.5)); }
  }
  @keyframes jj-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes jj-spin-reverse { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
</style>
